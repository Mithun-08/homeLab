services:
    speedtest-tracker:
        image: lscr.io/linuxserver/speedtest-tracker:latest
        restart: unless-stopped
        container_name: speedtest-tracker
        ports:
            - 8765:80
        environment:
            - PUID=1000 
            - PGID=1000
            - APP_KEY=${SPEEDTEST_APP_KEY}
            - APP_URL=http://localhost:8765
            - DB_CONNECTION=sqlite
        volumes:
            - ./speedtest-config:/config
